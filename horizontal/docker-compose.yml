services:
  app:
    build: .
    deploy:
      resources:
        limits:
          cpus : "0.1"
          memory : "100m"

  nginx:
    image: nginx:alpine
    ports:
      - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /var/log/nginx-host:/var/log/nginx 
    deploy:
      resources:
        limits:
          cpus : "0.5"
          memory : "512m"
    depends_on:
      - app